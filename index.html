<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravador NFC - Valeo</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #070e13; color: white; padding: 20px; }
    .panel { background: #1e252a; border-top: 4px solid #ab47bc; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { color: #ab47bc; text-align: center; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.75rem; color: #99aabb; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
    input { width: 100%; background: #14191d; color: white; border: 1px solid #2a3339; padding: 12px; border-radius: 4px; box-sizing: border-box; outline: none; }
    input:focus { border-color: #ab47bc; }
    button { width: 100%; background: #ab47bc; color: white; border: none; padding: 15px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .msg { text-align: center; font-size: 0.85rem; margin-top: 15px; color: #3de800; }
  </style>
</head>
<body>

  <div class="panel">
    <h2>Gravação de Etiqueta NFC</h2>
    <p style="text-align: center; color: #99aabb; font-size: 0.85rem; margin-bottom: 20px;">Utilize este app em um dispositivo Android (Chrome) para gravar as tags físicas.</p>

    <div class="input-group">
      <label>Componente</label>
      <input type="text" id="grav-comp" placeholder="Ex: Embreagem">
    </div>
    <div class="input-group">
      <label>Denominação</label>
      <input type="text" id="grav-den" placeholder="Ex: Conj. Platô e Disco">
    </div>
    <div class="input-group">
      <label>Data de Produção</label>
      <input type="date" id="grav-data">
    </div>
    <div class="input-group">
      <label>Número de Série (SN)</label>
      <input type="text" id="grav-ns" placeholder="SN-0000000" style="color: #ab47bc; font-weight: bold;">
    </div>

    <button onclick="escreverNFC()">GRAVAR NA TAG NFC</button>
    <div id="status" class="msg"></div>
  </div>

  <script>
    async function escreverNFC() {
      const msg = document.getElementById("status");
      
      if (!("NDEFReader" in window)) {
        msg.style.color = "#f27166";
        msg.innerText = "Erro: Navegador não suporta Web NFC. Use o Chrome no Android.";
        return;
      }

      const comp = document.getElementById("grav-comp").value;
      const den = document.getElementById("grav-den").value;
      const data = document.getElementById("grav-data").value;
      const ns = document.getElementById("grav-ns").value;

      if (!ns || !comp) {
        msg.style.color = "#f27166";
        msg.innerText = "Preencha o Componente e o Número de Série!";
        return;
      }

      // Monta o payload (o que vai dentro do chip)
      const payloadNFC = `COMP:${comp}|DEN:${den}|DATA:${data}|NS:${ns}`;

      try {
        msg.style.color = "#ab47bc";
        msg.innerText = "Aproxime o celular da tag NFC agora...";
        
        const ndef = new NDEFReader();
        await ndef.write(payloadNFC);
        
        msg.style.color = "#3de800";
        msg.innerText = "Gravação concluída com sucesso!";
        document.getElementById("grav-ns").value = ""; // Limpa para a próxima
      } catch (error) {
        msg.style.color = "#f27166";
        msg.innerText = "Falha ao gravar. Tente novamente.";
      }
    }
  </script>
</body>
</html>
